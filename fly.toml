# Fly.io Configuration
# Deploy with: flyctl launch --copy-existing-config

app = "genbuilder"
primary_region = "sjc"

[build]
  dockerfile = "./Dockerfile"

[env]
  APP_NAME = "GenBuilder"
  APP_VERSION = "1.0.0"
  DEBUG = "false"
  PORT = "8000"

[build.args]
  BUILDKIT_INLINE_CACHE = "1"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.http_checks]
    enabled = true
    uri = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "get"
    protocol = "http"
    restart_limit = 3

[env]
  CORS_ORIGINS = "https://genbuilder.fly.dev"
